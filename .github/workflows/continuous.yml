name: continuous

on:
  push:
    branches:
      - main
      - develop

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
      - name: 'Run: ReportCoverage, Publish, CreateGitHubRelease'
        run: ./build.cmd ReportCoverage Publish CreateGitHubRelease
        env:
          PublicNuGetApiKey: ${{ secrets.PUBLIC_NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: test-results'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
      - name: 'Publish: coverage-report.zip'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report.zip
          path: artifacts/reports/coverage-report.zip
      - name: 'Publish: packages'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
